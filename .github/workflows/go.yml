name: smtpd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: "Go: Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy -v
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Run go vet
        run: go vet -v ./...

      - name: Verify module dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  test:
    name: "Go: Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -count=1 ./...
  security:
    name: "Go: Security Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Keep the pinned version in sync with .github/workflows/security-daily.yml.
      - name: Install Semgrep
        run: python -m pip install semgrep==1.171.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/golang \
            --config p/security-audit \
            --error

      - name: Get changed Go packages
        id: changed-packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          PKGS=$(git diff --name-only "${BASE}...HEAD" | grep '\.go$' | xargs -r -I{} dirname {} | sort -u | sed 's|^|./|' | tr '\n' ' ')
          echo "packages=${PKGS}" >> "$GITHUB_OUTPUT"

      - name: Run gosec on changed packages
        if: steps.changed-packages.outputs.packages != ''
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated ${{ steps.changed-packages.outputs.packages }}
