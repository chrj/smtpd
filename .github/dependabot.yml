version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # This repository tags releases by hand, so the prefix does not need to be a
  # releasable type under release-please.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
